
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Rafting Travel to learn more about our rafting adventures, reservations, and services.">
    <meta name="author" content="Hans Fritz Retamal">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us | Rafting Travel</title>
</head>

<body>
    <header>
        <img src="images/rafting3.jpg" alt="Rafting Travel logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <div class="info">
            <h1>Rafting Travel Company</h1>
            <p class="contact-info">123 Main River Street</p>
            <p class="contact-info">Kolob, California</p>
            <p class="contact-info">+1 999 999 9999</p>
            <p class="contact-info">info@raftingtravel.com</p>
        </div>

        <div class="contact-container">

            <section class="map">
                <h2 class="title">Our Location</h2>
               <iframe src="https://www.google.com/maps/embed?pb=!4v1795563936351!6m8!1m7!1s_2Ta9zeZpjJEGXyNfwoy_A!2m2!1d38.49613774125918!2d-105.3228890700417!3f169.53299!4f0!5f0.7820865974627469" style=" border:0; width: 100%; height: 250px;"
               title="Goggle Maps"></iframe>
            </section>

            <section class="contact-form">
                <form>
                    <h2 class="title">Send Us a Message</h2>
                    <div class="form-row">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-row">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <fieldset class="purpose">
                            <legend>Message Purpose:</legend>

                            <div class="purpose-options">
                                <label for="general">
                                    <input type="radio" id="general" name="purpose" value="general">
                                    General Inquiry
                                </label>

                                <label for="reservation">
                                    <input type="radio" id="reservation" name="purpose" value="reservation">
                                    Reservation Question
                                </label>

                                <label for="suggestion">
                                    <input type="radio" id="suggestion" name="purpose" value="website">
                                    Website Suggestion
                                </label>
                            </div>
                        </fieldset>

                
                    <div class="message-row">
                        <label for="message">Message:</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>

                    <label for="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        Please subscribe me to the monthly newsletter
                    </label>

                    <button type="submit">Get in Touch!</button>

                </form>
            </section>

        </div>

        <section class="adventures1">
            <h2>We Are Here to Serve You!</h2>

            <figure>
                <img src="images/employee1.jpg" alt="Rafting employee">
                <figcaption>Maria Flores</figcaption>
            </figure>

            <figure>
                <img src="images/employee2.jpg" alt="Rafting employee">
                <figcaption>Maria Gomez</figcaption>
            </figure>

            <figure>
                <img src="images/employee3.jpg" alt="Rafting employee">
                <figcaption>Li Wei</figcaption>
            </figure>
        </section>

    </main>

    <footer>
        <p>©2026 Rafting Travel || Hans Fritz Retamal</p>

        <nav class="socialmedia">
            <a href="https://www.facebook.com">
                <img src="images/facebook.png" alt="Facebook icon">
            </a>

            <a href="https://www.instagram.com/">
                <img src="images/social.png" alt="Instagram icon">
            </a>

            <a href="https://www.youtube.com/">
                <img src="images/youtube.png" alt="YouTube icon">
            </a>
        </nav>
    </footer>

</body>
</html>
